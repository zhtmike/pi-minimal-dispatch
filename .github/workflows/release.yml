name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # gh release create
  id-token: write # npm OIDC trusted publishing — no npm token secret exists

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Guards — tag must match package.json version and CHANGELOG section
        run: |
          set -eu
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match package.json version $VERSION" >&2
            exit 1
          fi
          if ! grep -q "^## $VERSION — " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $VERSION — …' section" >&2
            exit 1
          fi
          awk -v ver="$VERSION" '$0 ~ "^## " ver " — " {p=1; next} /^## / {p=0} p' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - name: Guard — the tag must point at main's head (PR → merge → tag ritual)
        run: |
          set -eu
          tip="$(git ls-remote origin refs/heads/main | cut -f1)"
          tagged="$(git rev-parse "$GITHUB_SHA^{commit}")"
          if [ "$tagged" != "$tip" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} points at $tagged, not main's head $tip — merge the PR first, then tag the merge commit" >&2
            exit 1
          fi
      - run: npm test
      - name: Publish to npm (a re-tag of an already-published version is not a failure)
        run: |
          if ! npm publish --provenance; then
            version="$(node -p "require('./package.json').version")"
            [ "$(npm view "$(node -p "require('./package.json').name")" version)" = "$version" ] || exit 1
            echo "::warning::npm publish failed; the registry already has $version — npm versions are immutable, the published tarball may not match this commit" >&2
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
