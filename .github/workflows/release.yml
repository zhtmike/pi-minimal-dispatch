name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # gh release create
  id-token: write # npm OIDC trusted publishing — no npm token secret exists

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Guards — tag must match package.json version and CHANGELOG section
        run: |
          set -eu
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match package.json version $VERSION" >&2
            exit 1
          fi
          if ! grep -q "^## $VERSION — " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $VERSION — …' section" >&2
            exit 1
          fi
          awk -v ver="$VERSION" '$0 ~ "^## " ver " — " {p=1; next} /^## / {p=0} p' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - run: npm test
      - name: Publish to npm
        run: npm publish --provenance
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
